<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; background: #000;">
    <button id="startBtn" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background: #00FF00; font-weight: bold; border-radius: 50px; border: none; cursor: pointer;">
        INICIAR REALIDAD AUMENTADA
    </button>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
<video id="vid" src="./serpiente_lenta.webm" playsinline loop crossorigin="anonymous"></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
    <a-video src="#vid" width="3.5" height="2" position="-7 0 0.1"
             animation="property: position; from: -7 0 0.1; to: 7 0 0.1; dur: 10000; easing: linear; loop: true">
    </a-video>
</a-entity>
    </a-scene>
    <script>
        const btn = document.querySelector('#startBtn');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#vid');
        btn.addEventListener('click', () => {
            sceneEl.systems['mindar-image-system'].start();
            video.play();
            btn.style.display = 'none';
        });
        sceneEl.addEventListener('targetFound', () => { video.play(); });
        sceneEl.addEventListener('targetLost', () => { video.pause(); });
    </script>
</body>
</html>
