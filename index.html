<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden;">
    <button id="startBtn" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background-color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
        INICIAR EXPERIENCIA
    </button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <video id="vid" src="./serpiente.mp4" playsinline loop crossorigin="anonymous" muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        
            <a-video src="#vid" width="2.5" height="1.5" position="0 0 0.1"></a-video>
        
    </a-scene>

    <script>
        const btn = document.querySelector('#startBtn');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#vid');

        btn.addEventListener('click', () => {
            // Esto desbloquea el video y la cámara en móviles
            if (sceneEl.systems["mindar-image-system"]) {
                sceneEl.systems["mindar-image-system"].start();
                video.play();
                btn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
