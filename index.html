<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; background-color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">

    <button id="startBtn" style="z-index: 9999; padding: 30px; font-size: 24px; background: #00FF00; color: black; border: 5px solid white; border-radius: 20px; font-weight: bold; cursor: pointer;">
        PRESIONAR PARA VER SERPIENTE
    </button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <video id="vid" src="serpiente.mp4" playsinline loop="true" crossorigin="anonymous" muted></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-video src="#vid" width="2.5" height="1.5" position="0 0 0.3"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('startBtn');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#vid');

        btn.addEventListener('click', () => {
            console.log("Iniciando...");
            sceneEl.systems["mindar-image-system"].start(); 
            video.play();
            btn.style.display = 'none'; 
        });
    </script>
</body>
</html>
