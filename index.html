<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script>
    AFRAME.registerComponent('chromakey-video', {
      schema: {
        src: { type: 'selector' },
        color: { type: 'color', default: '#30a43f' },
        similarity: { default: 0.45 },
        smoothness: { default: 0.12 }
      },
      init: function() {
        this.el.addEventListener('object3dset', () => this.apply());
        if (this.el.getObject3D('mesh')) this.apply();
      },
      apply: function() {
        const video = this.data.src;
        const c = new THREE.Color(this.data.color);
        const texture = new THREE.VideoTexture(video);
        const material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: texture },
            keyColor: { value: new THREE.Vector3(c.r, c.g, c.b) },
            similarity: { value: this.data.similarity },
            smoothness: { value: this.data.smoothness }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
          `,
          fragmentShader: `
            uniform sampler2D map;
            uniform vec3 keyColor;
            uniform float similarity;
            uniform float smoothness;
            varying vec2 vUv;

            vec3 rgb2hsv(vec3 c) {
              vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
              vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
              vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
              float d = q.x - min(q.w, q.y);
              float e = 1.0e-10;
              return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
            }

            void main() {
              vec4 c = texture2D(map, vUv);
              vec3 hsv = rgb2hsv(c.rgb);
              vec3 keyHsv = rgb2hsv(keyColor);
              float hueDiff = abs(hsv.x - keyHsv.x);
              if (hueDiff > 0.5) hueDiff = 1.0 - hueDiff;
              float chromaDist = hueDiff * 2.0 + abs(hsv.y - keyHsv.y) * 0.5;
              float alpha = smoothstep(similarity - 0.1, similarity + smoothness, chromaDist);
              gl_FragColor = vec4(c.rgb, alpha);
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });
        const mesh = this.el.getObject3D('mesh');
        if (mesh) mesh.material = material;
      }
    });
    </script>
</head>
<body style="margin: 0; background: #000;">
    <button id="startBtn" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background: #00FF00; font-weight: bold; border-radius: 50px; border: none; cursor: pointer;">
        INICIAR REALIDAD AUMENTADA
    </button>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="alpha: true; antialias: true">
        <a-assets>
            <video id="vid" src="./serpiente.mp4" playsinline loop crossorigin="anonymous" muted></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane width="2.5" height="1.5" position="0 0 0.1"
                chromakey-video="src: #vid; color: #30a43f; similarity: 0.15; smoothness: 0.15">
            </a-plane>
        </a-entity>
    </a-scene>
    <script>
        const btn = document.querySelector('#startBtn');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#vid');

        btn.addEventListener('click', () => {
            if (sceneEl.hasLoaded) {
                sceneEl.systems['mindar-image-system'].start();
                video.play();
                btn.style.display = 'none';
            } else {
                sceneEl.addEventListener('loaded', () => {
                    sceneEl.systems['mindar-image-system'].start();
                    video.play();
                    btn.style.display = 'none';
                }, { once: true });
            }
        });

        sceneEl.addEventListener('targetFound', () => { video.play(); });
        sceneEl.addEventListener('targetLost', () => { video.pause(); });
    </script>
</body>
</html>
