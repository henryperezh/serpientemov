<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: { type: 'map' },
        color: { default: { x: 0.08, y: 0.35, z: 0.17 } },
        similarity: { default: 0.35 },
        smoothness: { default: 0.1 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D src;
        uniform vec3 color;
        uniform float similarity;
        uniform float smoothness;
        varying vec2 vUv;
        void main() {
          vec4 texColor = texture2D(src, vUv);
          float diff = length(texColor.rgb - color);
          float alpha = smoothstep(similarity, similarity + smoothness, diff);
          gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
        }
      `
    });
    </script>
</head>
<body style="margin: 0; background: #000;">
    <button id="startBtn" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background: #00FF00; font-weight: bold; border-radius: 50px; border: none; cursor: pointer;">
        INICIAR REALIDAD AUMENTADA
    </button>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="alpha: true; antialias: true">
        <a-assets>
            <video id="vid" src="./serpiente.mp4" playsinline loop crossorigin="anonymous" muted></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane src="#vid" width="2.5" height="1.5" position="0 0 0.1"
                material="shader: chromakey; src: #vid; color: 0.08 0.35 0.17; similarity: 0.35; smoothness: 0.1; transparent: true">
            </a-plane>
        </a-entity>
    </a-scene>
    <script>
        const btn = document.querySelector('#startBtn');
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('#vid');

        btn.addEventListener('click', () => {
            if (sceneEl.hasLoaded) {
                sceneEl.systems['mindar-image-system'].start();
                video.play();
                btn.style.display = 'none';
            } else {
                sceneEl.addEventListener('loaded', () => {
                    sceneEl.systems['mindar-image-system'].start();
                    video.play();
                    btn.style.display = 'none';
                }, { once: true });
            }
        });

        sceneEl.addEventListener('targetFound', () => { video.play(); });
        sceneEl.addEventListener('targetLost', () => { video.pause(); });
    </script>
</body>
</html>
